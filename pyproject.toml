[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changelogic"
version = "0.1.0"
description = "Interoperable changelog fragments and release-note rendering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["changelog", "release-notes", "markdown", "automation"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/faizanali2k05/changelogic"
Repository = "https://github.com/faizanali2k05/changelogic"
Issues = "https://github.com/faizanali2k05/changelogic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/changelogic"]
